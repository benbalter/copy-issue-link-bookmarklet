name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Type check and lint
        run: npm test
      - name: Build bookmarklet
        run: |
          rm -rf dist
          npm run build
      - name: Verify bookmarklet output
        run: test -s dist/bookmark.js
      - name: Verify committed dist is up to date
        run: git diff --exit-code dist/
      - name: Verify published page is up to date
        run: |
          script/build-page
          git diff --exit-code index.md
